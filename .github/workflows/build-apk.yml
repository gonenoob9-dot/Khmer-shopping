name: Build Khmer Shopping APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Locate project (unzips khmer_shopping.zip if needed)
        id: locate
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            DIR="."
          else
            ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
            [ -z "$ZIP" ] && { echo "No pubspec.yaml or .zip in repo root"; exit 1; }
            mkdir -p _project && unzip -q -o "$ZIP" -d _project
            PUB=$(find _project -name pubspec.yaml -not -path '*/.*/*' | head -n 1)
            [ -z "$PUB" ] && { echo "pubspec.yaml not found in zip"; exit 1; }
            DIR=$(dirname "$PUB")
          fi
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            flutter create --platforms=android --org com.khmershopping \
              --project-name khmer_shopping --no-pub "$RUNNER_TEMP/scaffold"
            cp -r "$RUNNER_TEMP/scaffold/android" ./android
          fi
          sed -i 's/android:label="[^"]*"/android:label="Khmer Shopping"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter pub get

      - name: Launcher icons
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: ${{ steps.locate.outputs.dir }}
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: flutter build apk --release

      - name: Prepare APK
        id: apk
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/KhmerShopping.apk
          echo "path=${{ steps.locate.outputs.dir }}/dist/KhmerShopping.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KhmerShopping-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish APK to Releases
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Khmer Shopping - latest APK
          body: Download KhmerShopping.apk and install it on your Android phone.
          files: ${{ steps.apk.outputs.path }}
          make_latest: true
